<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weekly Metrics</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/drilldown.css">
</head>
<body>
  <header id="header" class="header">
    <h1 id="title">Weekly Metrics</h1>
    <span id="status" class="status">Loading…</span>
  </header>

  <!-- Each card goes into the slot with its key (see js/app.js). Cards are unchanged.
       Row 1: New Customers, Received, Quoted, Won. Row 2: Quoted Value, Avg. Quote time, Total Open, Total Sampling.
       Won Value / Total Quoted only show when switched on in js/config.js (components). -->
  <main id="grid" class="layout">
    <div class="slot" data-slot="customers"></div>
    <div class="slot" data-slot="received"></div>
    <div class="slot" data-slot="quoted"></div>
    <div class="slot" data-slot="won"></div>
    <div class="slot" data-slot="quotedValue"></div>
    <div class="slot" data-slot="quoteTimeline"></div>
    <div class="slot" data-slot="totalOpen"></div>
    <div class="slot" data-slot="totalSampling"></div>
    <div class="slot" data-slot="wonValue"></div>
    <div class="slot" data-slot="totalQuoted"></div>
  </main>

  <pre id="debug" class="debug" hidden></pre>

  <script type="module" src="js/app.js"></script>
</body>
</html>
